<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Valorant Agents Wiki</title>

<style>
body {
    font-family: Arial;
    background-color: #0f1923;
    color: white;
    margin: 0;
}

header {
    text-align: center;
    padding: 20px;
    background-color: #1f2731;
    color: #ff4655;
}

.agent-list {
    text-align: center;
    padding: 20px;
}

.agent {
    border: 2px solid #ff4655;
    border-radius: 10px;
    padding: 15px;
    margin: 10px;
    display: inline-block;
    width: 180px;
    cursor: pointer;
    transition: 0.3s;
}

.agent:hover {
    background-color: #ff4655;
}

#content {
    max-width: 900px;
    margin: auto;
    padding: 20px;
    display: none;
}

.section {
    margin-top: 30px;
}

.section h2 {
    color: #ff4655;
}

img {
    width: 250px;
    margin: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
<h1>Valorant Agent Wiki</h1>
</header>

<div class="agent-list">
    <div class="agent" onclick="loadJett()">Jett</div>
    <div class="agent" onclick="loadSage()">Sage</div>
</div>

<div id="content"></div>

<script>

function loadJett() {
    document.getElementById("content").style.display = "block";
    document.getElementById("content").innerHTML = `
        <h1>Jett</h1>
        <p><b>Vai trò:</b> Duelist</p>
        <p><b>Quốc gia:</b> Hàn Quốc</p>

        <div class="section">
            <h2>Tổng Quan</h2>
            <p>Jett là một đặc vụ nhanh nhẹn với khả năng di chuyển linh hoạt và áp sát mục tiêu cực nhanh.</p>
        </div>

        <div class="section">
            <h2>Bộ Kỹ Năng</h2>
            <p><b>Q - Cloudburst:</b> Ném khói che tầm nhìn.</p>
            <p><b>E - Tailwind:</b> Lướt nhanh về phía trước.</p>
            <p><b>C - Updraft:</b> Bay lên cao.</p>
            <p><b>X - Blade Storm:</b> Triệu hồi phi tiêu gây sát thương lớn.</p>
        </div>

        <div class="section">
            <h2>Cốt Truyện</h2>
            <p>Jett sinh ra tại Hàn Quốc và được biết đến với khả năng điều khiển gió. Cô tham gia Valorant Protocol sau một sự cố lớn liên quan đến radianite.</p>
        </div>

        <div class="section">
            <h2>Hình Ảnh</h2>
            <img src="https://media.valorant-api.com/agents/add6443a-41bd-e414-f6ad-e58d267f4e95/fullportrait.png">
            <img src="https://media.valorant-api.com/agents/add6443a-41bd-e414-f6ad-e58d267f4e95/displayicon.png">
        </div>
    `;
}

function loadSage() {
    document.getElementById("content").style.display = "block";
    document.getElementById("content").innerHTML = `
        <h1>Sage</h1>
        <p><b>Vai trò:</b> Sentinel</p>
        <p><b>Quốc gia:</b> Trung Quốc</p>

        <div class="section">
            <h2>Tổng Quan</h2>
            <p>Sage là đặc vụ hỗ trợ với khả năng hồi máu và hồi sinh đồng đội.</p>
        </div>

        <div class="section">
            <h2>Bộ Kỹ Năng</h2>
            <p><b>Q - Slow Orb:</b> Làm chậm khu vực.</p>
            <p><b>E - Healing Orb:</b> Hồi máu.</p>
            <p><b>C - Barrier Orb:</b> Tạo tường chắn.</p>
            <p><b>X - Resurrection:</b> Hồi sinh đồng đội.</p>
        </div>

        <div class="section">
            <h2>Cốt Truyện</h2>
            <p>Sage là bác sĩ chiến trường của Valorant Protocol với sức mạnh từ radianite.</p>
        </div>

        <div class="section">
            <h2>Hình Ảnh</h2>
            <img src="https://media.valorant-api.com/agents/569fdd95-4d10-43ab-ca70-79becc718b46/fullportrait.png">
            <img src="https://media.valorant-api.com/agents/569fdd95-4d10-43ab-ca70-79becc718b46/displayicon.png">
        </div>
    `;
}

</script>

</body>
</html>
