<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Valorant Agents</title>

<style>
body {
    font-family: Arial;
    background-color: #0f1923;
    color: white;
    text-align: center;
}

h1 {
    color: #ff4655;
}

.agent-container {
    margin-top: 30px;
}

.agent {
    border: 2px solid #ff4655;
    border-radius: 10px;
    padding: 15px;
    margin: 10px;
    display: inline-block;
    width: 200px;
    transition: 0.3s;
}

.agent:hover {
    background-color: #ff4655;
    cursor: pointer;
}

#detail {
    margin-top: 40px;
    padding: 20px;
    border-top: 2px solid #ff4655;
    display: none;
}

#detail img {
    width: 200px;
    border-radius: 10px;
    margin-top: 15px;
}
</style>
</head>

<body>

<h1>Thông Tin Agent Valorant</h1>

<div class="agent-container">
    <div class="agent" onclick="showAgent('Jett','Duelist - Hàn Quốc','https://media.valorant-api.com/agents/add6443a-41bd-e414-f6ad-e58d267f4e95/fullportrait.png')">
        <h2>Jett</h2>
        <p>Duelist</p>
    </div>

    <div class="agent" onclick="showAgent('Phoenix','Duelist - Anh','https://media.valorant-api.com/agents/eb93336a-449b-9c1b-0a54-a891f7921d69/fullportrait.png')">
        <h2>Phoenix</h2>
        <p>Duelist</p>
    </div>

    <div class="agent" onclick="showAgent('Sage','Sentinel - Trung Quốc','https://media.valorant-api.com/agents/569fdd95-4d10-43ab-ca70-79becc718b46/fullportrait.png')">
        <h2>Sage</h2>
        <p>Sentinel</p>
    </div>

    <div class="agent" onclick="showAgent('Sova','Initiator - Nga','https://media.valorant-api.com/agents/320b2a48-4d9b-a075-30f1-1f93a9b638fa/fullportrait.png')">
        <h2>Sova</h2>
        <p>Initiator</p>
    </div>
</div>

<div id="detail">
    <h2 id="agentName"></h2>
    <p id="agentInfo"></p>
    <img id="agentImage">
</div>

<script>
function showAgent(name, info, image) {
    document.getElementById("detail").style.display = "block";
    document.getElementById("agentName").innerText = name;
    document.getElementById("agentInfo").innerText = info;
    document.getElementById("agentImage").src = image;
}
</script>

</body>
</html>
